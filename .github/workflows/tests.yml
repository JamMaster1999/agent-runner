# Two jobs pin the suite's two contracts (stage-3 carve-out):
#
#   core     — the package installed with NO extras and temporalio proven
#              absent: core must import and pass Temporal-less, so an
#              import leak from the optional layers fails the build
#              (agent_runner.md). The temporal suite MUST skip cleanly
#              here; that skip path is itself part of the contract.
#   temporal — the package with the [temporal] extra: the activity-wrapper
#              suite runs for real. Exactly 4 sanctioned skips (see the
#              grep below); any other count means the environment recipe
#              silently broke.
#
# No database service and no psycopg anywhere: the platform half (jobs /
# attempts / events / leases over Postgres) was deleted at stage 3.
name: tests

on: [push, pull_request]

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the package (core only, no extras)
        run: pip install -e .
      - name: Prove Temporal is absent
        run: |
          if pip show temporalio >/dev/null 2>&1; then
            echo '::error::temporalio is installed in the core job - the Temporal-less contract cannot be proven'
            exit 1
          fi
      - name: Run suite Temporal-less (temporal tests must skip cleanly)
        run: |
          set -o pipefail  # tee must not mask the unittest exit code
          python -m unittest discover tests 2>&1 | tee core_output.txt
          # The temporal suite (and the usage-parity live sweeps) must have
          # SKIPPED, not silently run or erred.
          grep -E 'OK \(skipped=[0-9]+\)$' core_output.txt

  temporal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the package with the temporal extra
        run: pip install -e '.[temporal]'
      - name: Run suite (exactly the 4 sanctioned skips)
        run: |
          set -o pipefail  # tee must not mask the unittest exit code
          python -m unittest discover tests 2>&1 | tee temporal_output.txt
          # The ONLY sanctioned skips with the extra installed:
          #   2x test_usage_parity live-capture sweeps (.local/runs never exists in CI)
          #   1x the core import sweep (meaningful only Temporal-less; runs in the core job)
          #   1x the missing-extra guidance path (needs temporalio absent)
          grep -qxE 'OK \(skipped=4\)' temporal_output.txt || {
            echo '::error::expected exactly OK (skipped=4) - the temporal test environment recipe broke'
            exit 1
          }

  # Boundary gates: plain bash, scanning ONLY src/ — tests/ are exempt
  # (they may spell provider names and platform history). Each step says
  # what it forbids and why; on a hit it prints the offending lines and
  # exits 1. A gate must fail loudly, never pass as "no hits", when the
  # scan itself breaks: each step checks its scan directory exists and
  # captures every grep's status so exit 2 also fails the step.
  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # WHAT: any temporalio import/reference outside src/agent_runner/temporal/.
      # WHY:  core is Temporal-free by ruling; the optional layer must never
      #       leak down. (The core CI job proves it dynamically; this gate
      #       catches it even in temporal-extra runs.)
      # Allowlist: src/agent_runner/temporal/ only.
      - name: Temporal wall (temporalio only in agent_runner/temporal/)
        run: |
          if [ ! -d src/agent_runner ]; then
            echo '::error::scan directory src/agent_runner is missing - the gate cannot vouch for a tree it did not scan'
            exit 2
          fi
          status=0
          grep -rn 'temporalio' src/agent_runner --include='*.py' > temporal_hits.txt || status=$?
          if [ "$status" -ge 2 ]; then
            echo "::error::gate grep errored (exit $status) instead of scanning"
            exit "$status"
          fi
          status=0
          grep -vE '^src/agent_runner/temporal/' temporal_hits.txt > temporal_offenders.txt || status=$?
          if [ "$status" -ge 2 ]; then
            echo "::error::gate grep errored (exit $status) while applying the temporal/ exemption"
            exit "$status"
          fi
          if [ -s temporal_offenders.txt ]; then
            cat temporal_offenders.txt
            echo '::error::temporalio referenced outside src/agent_runner/temporal/ - core must run with Temporal absent'
            exit 1
          fi

      # WHAT: any database driver or SQL in the shipped package.
      # WHY:  the platform half (jobs/attempts/events/leases over Postgres)
      #       was deleted at stage 3; the runner owns no store and must not
      #       grow one back.
      # Allowlist: none.
      - name: No database code in src/
        run: |
          if [ ! -d src ]; then
            echo '::error::scan directory src is missing - the gate cannot vouch for a tree it did not scan'
            exit 2
          fi
          status=0
          grep -rnE 'psycopg|INSERT INTO|UPDATE [a-z_]+ SET|DELETE FROM' src --include='*.py' > db_hits.txt || status=$?
          if [ "$status" -ge 2 ]; then
            echo "::error::gate grep errored (exit $status) instead of scanning"
            exit "$status"
          fi
          if [ -s db_hits.txt ]; then
            cat db_hits.txt
            echo '::error::database code in src/ - the platform half died at stage 3 and must not return'
            exit 1
          fi

      # WHAT: the words claude/codex anywhere in src/agent_runner outside
      #       harness/ — case-insensitive, comments included.
      # WHY:  pluggability — every claude/codex-specific behavior lives in
      #       harness/ (the registry in harness/__init__.py is inside the
      #       allowed dir). A code literal outside harness/ is a design
      #       regression to fix, never to allowlist.
      # Allowlist: src/agent_runner/harness/ only.
      - name: Provider-name wall (claude/codex only in harness/)
        run: |
          if [ ! -d src/agent_runner ]; then
            echo '::error::scan directory src/agent_runner is missing - the gate cannot vouch for a tree it did not scan'
            exit 2
          fi
          status=0
          grep -rniE '\b(claude|codex)\b' src/agent_runner --include='*.py' > provider_hits.txt || status=$?
          if [ "$status" -ge 2 ]; then
            echo "::error::gate grep errored (exit $status) instead of scanning"
            exit "$status"
          fi
          status=0
          grep -vE '^src/agent_runner/harness/' provider_hits.txt > provider_offenders.txt || status=$?
          if [ "$status" -ge 2 ]; then
            echo "::error::gate grep errored (exit $status) while applying the harness/ exemption"
            exit "$status"
          fi
          if [ -s provider_offenders.txt ]; then
            cat provider_offenders.txt
            echo '::error::provider name (claude/codex) outside src/agent_runner/harness/ - provider knowledge lives in the harness adapters'
            exit 1
          fi
