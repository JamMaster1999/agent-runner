[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-runner"
version = "0.2.0"   # 0.2.0: step-10.5 append-only agent emit (restricted runner_emitter DSN)
description = "Generic agent-CLI job runner extracted from the Uflo GTM pipeline (extraction plan step 6)."
requires-python = ">=3.13"        # matches Mac system python3 (3.13.3), venv-modal, GTM CI
dependencies = ["psycopg[binary]==3.3.4"]   # reviewed cutover transport; lazy import preserves stdlib contract

[project.scripts]
agent-runner = "agent_runner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_runner = ["py.typed"]
