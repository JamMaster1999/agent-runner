[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-runner"
version = "1.2.0"   # 1.2.0: the stall watchdog — a silent CLI ends the attempt `stalled`, the eighth outcome word (1.1.0: the optional S3 state mirror; 1.0.0: stage-3 carve-out, the Postgres platform half deleted)
description = "Runs codex/claude CLI agents and tells the truth about what happened: spawn, stream, classify, repair, sessions, auth, workdirs, hygiene, isolation."
requires-python = ">=3.13"        # matches the worker base image and consumer CI
dependencies = []                 # core is stdlib-only by design; CI proves it imports with Temporal absent

[project.optional-dependencies]
temporal = ["temporalio>=1.7"]    # the activity wrapper (agent_runner.temporal)
s3 = ["boto3>=1.34"]              # the state mirror (agent_runner.state), imported only when AGENT_RUNNER_STATE_S3 is set

[project.scripts]
agent-runner = "agent_runner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_runner = ["py.typed"]

[tool.pytest.ini_options]
# live_*.py is the operator-run live tier (tests/live, RUN_LIVE=1): pytest
# collects it, while CI's `python -m unittest discover` (pattern test*.py)
# never sees it — the live tier is pytest-native and CI has no pytest.
python_files = ["test_*.py", "live_*.py"]
asyncio_mode = "auto"
