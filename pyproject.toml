[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-runner"
version = "2.18.0"   # 2.18.0: the browser resource announces itself as Chrome, not HeadlessChrome — the major version is the binary's own, the platform the host's — because that one token is what bot rules block on sight. 2.17.0: a rate limit names its kind — rate (too many at once), usage (the window is spent), server (the provider is busy) — from the CLI's typed events first and its wording last; a pool is a ledger of what each account carries: an attempt leases the least-loaded free account, a rate limit halves its cap and pauses new starts, a usage limit holds it until the reset, a valid attempt grows the cap back toward the account's share; rate and server limits re-run the attempt in place after a jittered, doubling pause, and every rate-limited retry delay carries jitter; 2.16.0: the executor contract is async (Modal on its .aio API, the local backend on asyncio subprocesses), the sandbox supervisor pumps heartbeats through every phase and itself ends an attempt whose stream goes silent for the activity's heartbeat timeout; 1.7.1: the keeper clears a previous keeper's markers on a reused root; 1.7.0: attempts run in sandboxes — the executor adaptor (Modal + local), the workspace keeper (local tree, S3 backup on a cadence), the attempt-in-sandbox protocol and its Temporal supervisor (heartbeats only what it fetched), liveness by file writes and a memory fuse, the codex sandbox credential; the per-file mirror, CPU affinity, and orphan hints retire; 1.6.0: the running attempt's transcript is re-mirrored every 20s while it grows (a dashboard follows the session live from S3); 1.5.0: the captured stream is stamped line by line with its arrival time (the dashboard stops interpolating); 1.4.0: one typed record per attempt (usage, session_usage, timestamps, resets_at) rides the heartbeat and history, live usage in the heartbeat, the prompt reaches the CLI as a file on stdin, rate_limited retries wait for the CLI's reset time (capped by config, failing at once when the reset leaves no retry window), and Claude tokens come from modelUsage (the same scope as total_cost_usd); 1.3.0: failure details reach history (outcome, CLI text, session, prior attempts) and the Claude subscription cap classifies rate_limited from its typed event; 1.2.0: the stall watchdog — a silent CLI ends the attempt `stalled`, the eighth outcome word (1.1.0: the optional S3 state mirror; 1.0.0: stage-3 carve-out, the Postgres platform half deleted)
description = "Runs codex/claude CLI agents and tells the truth about what happened: spawn, stream, classify, repair, sessions, auth, workdirs, hygiene, isolation."
requires-python = ">=3.13"        # matches the worker base image and consumer CI
dependencies = []                 # core is stdlib-only by design; CI proves it imports with Temporal absent

[project.optional-dependencies]
temporal = ["temporalio>=1.7"]    # the activity wrapper (agent_runner.temporal)
s3 = ["boto3>=1.34"]              # the workspace's S3 side (agent_runner.state), imported only when AGENT_RUNNER_STATE_S3 is set
modal = ["modal>=1.5"]            # the Modal executor (agent_runner.executor.ModalExecutor)

[project.scripts]
agent-runner = "agent_runner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_runner = ["py.typed"]

[tool.pytest.ini_options]
# live_*.py is the operator-run live tier (tests/live, RUN_LIVE=1): pytest
# collects it, while CI's `python -m unittest discover` (pattern test*.py)
# never sees it — the live tier is pytest-native and CI has no pytest.
python_files = ["test_*.py", "live_*.py"]
asyncio_mode = "auto"
